# .gitlab-ci.yml

# This GitLab CI/CD template is designed for a fraud detection model in the banking industry.
# It includes stages for building, testing, and deploying the model, with best practices
# for security, artifact management, and environment-specific deployments.

# Define the default image to use for all jobs.
# You might want a custom image with Python, pip, and other ML dependencies pre-installed.
image: python:3.9-slim-buster

# Define global variables that can be used across multiple jobs.
variables:
  # Python virtual environment path
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHON_ENV_PATH: "$CI_PROJECT_DIR/.venv"
  # Model specific variables
  MODEL_NAME: "fraud-detection-model"
  MODEL_VERSION: "1.0.0" # Or use CI_COMMIT_SHORT_SHA for unique versions
  ARTIFACT_PATH: "artifacts/"

# Define stages for the CI/CD pipeline.
# - build: For building the model package, dependencies, etc.
# - test: For running unit tests, integration tests, and model validation.
# - scan: For security scanning (SAST, Dependency Scanning).
# - deploy_staging: For deploying to a staging environment for UAT.
# - deploy_production: For deploying to the production environment.
stages:
  - build
  - test
  - scan
  - deploy_staging
  - deploy_production

# Cache Python dependencies to speed up subsequent pipeline runs.
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .venv/
    - .cache/pip/
  policy: pull-push # Pull cache before job, push after job

# -----------------------------------------------------------------------------
# Build Stage
# -----------------------------------------------------------------------------

# Job to install dependencies and package the model.
build_model:
  stage: build
  script:
    - echo "--- Building the Fraud Detection Model ---"
    # Create a virtual environment and install dependencies
    - python -m venv $PYTHON_ENV_PATH
    - source $PYTHON_ENV_PATH/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install setuptools wheel # Ensure these are installed for packaging

    # Placeholder for model building/training script if applicable
    # If the model is trained as part of the pipeline, uncomment and adjust:
    # - python scripts/train_model.py --output-path $ARTIFACT_PATH/$MODEL_NAME.pkl

    # Package the model and its artifacts (e.g., serialized model, preprocessors, metadata)
    # This assumes your project has a setup.py or a script to package the model.
    - mkdir -p $ARTIFACT_PATH
    - echo "Packaging model artifacts..."
    # Example: Copying a pre-trained model or a dummy artifact for demonstration
    - echo "Dummy model artifact content" > $ARTIFACT_PATH/$MODEL_NAME-$MODEL_VERSION.pkl
    - echo "Dummy preprocessor artifact content" > $ARTIFACT_PATH/preprocessor.pkl
    - echo "Model metadata: version $MODEL_VERSION, trained on $(date)" > $ARTIFACT_PATH/metadata.txt

    - echo "Model build complete. Artifacts stored in $ARTIFACT_PATH"
  artifacts:
    paths:
      - $ARTIFACT_PATH/
    expire_in: 1 week # Keep artifacts for a week
  tags:
    - docker # Example tag, adjust as per your GitLab Runner setup

# -----------------------------------------------------------------------------
# Test Stage
# -----------------------------------------------------------------------------

# Job to run unit tests.
unit_test:
  stage: test
  script:
    - echo "--- Running Unit Tests ---"
    - source $PYTHON_ENV_PATH/bin/activate
    - pip install pytest # Install pytest if not in requirements.txt
    - pytest tests/unit/ # Assuming unit tests are in tests/unit/
  dependencies:
    - build_model # Ensure build_model runs before this
  tags:
    - docker

# Job to run integration tests.
integration_test:
  stage: test
  script:
    - echo "--- Running Integration Tests ---"
    - source $PYTHON_ENV_PATH/bin/activate
    - pip install pytest # Install pytest if not in requirements.txt
    # This might involve setting up a test database or mock services.
    - pytest tests/integration/ # Assuming integration tests are in tests/integration/
  dependencies:
    - build_model
  tags:
    - docker

# Job for model validation and performance testing.
# This is crucial for fraud detection models.
model_validation:
  stage: test
  script:
    - echo "--- Performing Model Validation and Performance Testing ---"
    - source $PYTHON_ENV_PATH/bin/activate
    - pip install scikit-learn pandas # Example ML libraries, install as needed
    # This script would load the model, run it against a validation dataset,
    # and generate metrics (e.g., AUC-ROC, precision, recall, F1-score).
    - python scripts/validate_model.py \
        --model-path $ARTIFACT_PATH/$MODEL_NAME-$MODEL_VERSION.pkl \
        --data-path data/validation_data.csv \
        --output-metrics $ARTIFACT_PATH/model_metrics.json
    - echo "Model validation complete. Metrics available in $ARTIFACT_PATH/model_metrics.json"
  artifacts:
    paths:
      - $ARTIFACT_PATH/model_metrics.json
    reports:
      # Use GitLab's metrics reporting if applicable
      metrics: $ARTIFACT_PATH/model_metrics.json
  dependencies:
    - build_model
  tags:
    - docker

# -----------------------------------------------------------------------------
# Scan Stage (Security)
# -----------------------------------------------------------------------------

# Include GitLab's SAST (Static Application Security Testing) template.
# This will scan your code for known vulnerabilities.
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

# Customize SAST job if needed (e.g., specific analyzers)
sast:
  stage: scan
  variables:
    SAST_EXCLUDED_PATHS: "tests/, docs/" # Exclude non-code paths
  dependencies: [] # SAST typically doesn't need prior artifacts
  tags:
    - docker

dependency_scanning:
  stage: scan
  dependencies: []
  tags:
    - docker

# -----------------------------------------------------------------------------
# Deployment Stages
# -----------------------------------------------------------------------------

# Job to deploy the model to a staging environment.
deploy_to_staging:
  stage: deploy_staging
  environment:
    name: staging
    url: https://staging.yourbank.com/fraud-detection
  script:
    - echo "--- Deploying Model to Staging Environment ---"
    - source $PYTHON_ENV_PATH/bin/activate
    # Placeholder for deployment script. This could:
    # - Push the model artifacts to a model registry (e.g., MLflow, Sagemaker, custom storage).
    # - Update a Kubernetes deployment with the new model image.
    # - Trigger an API gateway update to point to the new model service.
    # - Run database migrations if necessary for model serving.
    - python scripts/deploy_model.py \
        --environment staging \
        --model-path $ARTIFACT_PATH/$MODEL_NAME-$MODEL_VERSION.pkl \
        --model-version $MODEL_VERSION \
        --api-endpoint $STAGING_API_ENDPOINT # Define this as a CI/CD variable
    - echo "Model $MODEL_NAME:$MODEL_VERSION deployed to staging."
  dependencies:
    - build_model
    - unit_test
    - integration_test
    - model_validation
    - sast # Ensure security scans pass before deployment
    - dependency_scanning
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH' # Deploy to staging on main branch commits
  tags:
    - docker
    - deploy # Tag for runners capable of deployment

# Job to deploy the model to the production environment.
# This typically requires a manual approval or a specific tag/branch.
deploy_to_production:
  stage: deploy_production
  environment:
    name: production
    url: https://production.yourbank.com/fraud-detection
  script:
    - echo "--- Deploying Model to Production Environment ---"
    - source $PYTHON_ENV_PATH/bin/activate
    # Similar deployment steps as staging, but targeting production infrastructure.
    - python scripts/deploy_model.py \
        --environment production \
        --model-path $ARTIFACT_PATH/$MODEL_NAME-$MODEL_VERSION.pkl \
        --model-version $MODEL_VERSION \
        --api-endpoint $PRODUCTION_API_ENDPOINT # Define this as a CI/CD variable
    - echo "Model $MODEL_NAME:$MODEL_VERSION deployed to production."
  dependencies:
    - build_model
    - unit_test
    - integration_test
    - model_validation
    - sast
    - dependency_scanning
    - deploy_to_staging # Ensure staging deployment was successful
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/' # Deploy to production on version tags (e.g., v1.0.0)
      when: manual # Requires manual approval for production deployment
      allow_failure: false # Production deployment should not fail
  tags:
    - docker
    - deploy
    - production # Tag for runners with production access
