# yaml-language-server: $schema=https://raw.githubusercontent.com/devfile/api/v2.2.2/schemas/latest/devfile.json
- devpod image for ML/AI workflows 

schemaVersion: 2.2.2

variables:
  DEVPOD_USERNAME: devpod
  DEVPOD_IMAGE_MIDDLE_NAME: devpoduser
  DEVPOD_IDE_PURGE: 'true'
  DEVPOD_GITLAB_URL: 'https://devcloud.ubs.net'

projects:
  - name: ai-ml-project
    git:
      remotes:
        origin: https://devcloud.ubs.net/ubs-ag/gt/gcto/data-architecture-and-services/devpod/devfile-templates.git

attributes:
  controller.devfile.io/storage-type: per-workspace

pod-overrides:
  spec:
    enableServiceLinks: true
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000

commands:
  - id: configure-devpod-scripts
    exec:
      component: dev
      workingDir: ~/
      commandLine: |
        if [ -f /usr/local/home/{{DEVPOD_USERNAME}}/bin/configure-micromamba.sh ]; then
          sh /usr/local/home/{{DEVPOD_USERNAME}}/bin/configure-micromamba.sh {{DEVPOD_USERNAME}}
        fi
        if [ -f /usr/local/home/{{DEVPOD_USERNAME}}/bin/configure-git-oauth.sh ]; then
          sh /usr/local/home/{{DEVPOD_USERNAME}}/bin/configure-git-oauth.sh {{DEVPOD_GITLAB_URL}} {{DEVPOD_USERNAME}}
        fi

  - id: install-ml-packages
    exec:
      component: dev
      workingDir: ~/
      commandLine: |
        if [ ! -f ~/install_ml_packages.sh ]; then
          echo '#!/bin/bash' > ~/install_ml_packages.sh
          echo 'source ~/.bashrc' >> ~/install_ml_packages.sh
          echo 'micromamba activate tools_env' >> ~/install_ml_packages.sh
          echo 'micromamba install -y numpy pandas scikit-learn matplotlib seaborn jupyterlab xgboost lightgbm opencv tensorflow pytorch -c conda-forge' >> ~/install_ml_packages.sh
          chmod +x ~/install_ml_packages.sh
          ~/install_ml_packages.sh
        fi

events:
  postStart:
    - configure-devpod-scripts
    - install-ml-packages

components:
  - name: home
    volume:
      size: 16Gi

  - name: dev
    container:
      image: container-registry.ubs.net/ubs/gctojanus/ubi8-{{DEVPOD_IMAGE_MIDDLE_NAME}}-python:latest
      cpuLimit: 4000m
      cpuRequest: 1300m
      memoryLimit: 8Gi
      memoryRequest: 8Gi
      env:
        - name: ENV_VAR_NAME
          value: env_var_value
      volumeMounts:
        - name: home
          path: /home/{{DEVPOD_USERNAME}}
      mountSources: true
      command: ["/bin/sh"]
      args: ["-c", "while true; do sleep 30; done;"]
